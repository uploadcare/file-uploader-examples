<!DOCTYPE html>
<html lang="en">
<head>
  <title>Uploadcare JS Minimal Example</title>
  <meta name="description" content="Uploading files with HTML and JS using Uploadcare"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script type="module" src="./minimal.js"></script>
</head>
<body>
  <main class="page-root">
    <!--
      Three sibling custom elements share `ctx-name` to identify the
      uploader (config + UI + provider). See regular.html for prose.
      `pubkey` is the demo sandbox; replace with your own from
      https://app.uploadcare.com/projects/-/api-keys/.
    -->
    <uc-config
      id="my-uploader-config"
      ctx-name="my-uploader"
      pubkey="a6ca334c3520777c0045"
      sourceList="local, url, camera, dropbox, unsplash"
    ></uc-config>
    <uc-file-uploader-minimal
      id="my-uploader"
      ctx-name="my-uploader"
    ></uc-file-uploader-minimal>
    <uc-upload-ctx-provider
      ctx-name="my-uploader"
      id="my-uploader-provider"
    ></uc-upload-ctx-provider>

    <div class="errors" id="errors"></div>
    <div class="previews" id="previews"></div>
  </main>
</body>
</html>
